<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- maximum-scale stops Safari's zoom-on-focus; pinch zoom still works
     (Safari has ignored user-scalable for pinch since iOS 10). -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0C0A11" />
<title>Refrain · Phone</title>
<!-- Served by the separate phone listener (server/remote.js), which serves
     only this page and remote.js. Self-contained on purpose: no fonts, no
     Tailwind, nothing else from the app is reachable from here. The look is the
     booth's (.claude/creative-direction.md): the same palette, a bezel and glass
     readout, butted square keys, and the Search field's travelling ring. -->
<style>
  /* A display rule below would otherwise beat the hidden attribute. */
  [hidden] { display:none !important; }
  :root { --ground:#0C0A11; --surface:#16121C; --raised:#221D2B; --hair:#3D3348; --shadowline:#060409; --text:#F4EFF3; --muted:#A295AC; --dim:#7A6E86; --plum:#8446C9; --plum-lit:#A96FE8; --phosphor:#CBB4F0; --amber:#C9922E; --go:#FF4A24; --mono:ui-monospace, Menlo, monospace; }
  * { box-sizing:border-box; }
  /* A phone page that behaves like an app: no rubber-band bounce, no zoom on a
     quick double tap (which is exactly how a confirm is pressed), no text
     resizing on rotate. */
  html, body { height:100%; overscroll-behavior:none; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  button, a, input, textarea { touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  /* 16px or more, or Safari zooms in when a box gets the cursor. */
  input, textarea { font-size:16px; }
  body { margin:0; background:var(--ground); color:var(--text); font:16px/1.4 -apple-system, system-ui, sans-serif; }
  #app { height:100%; max-width:560px; margin-inline:auto; display:flex; flex-direction:column; position:relative; overflow:hidden; }
  .topbar { flex:none; display:flex; align-items:center; justify-content:space-between; padding:calc(10px + env(safe-area-inset-top)) 16px 10px; }
  .wordmark { font:800 13px/1 var(--mono); letter-spacing:.24em; text-transform:uppercase; }
  .lamp { display:inline-flex; align-items:center; gap:6px; background:none; border:0; color:var(--muted); font:600 9px/1 var(--mono); letter-spacing:.15em; text-transform:uppercase; min-height:32px; padding:0 4px; }
  .lamp::before { content:""; width:6px; height:6px; border-radius:50%; background:#4ade80; box-shadow:0 0 6px #4ade80; }
  .lamp.off::before { background:var(--amber); box-shadow:0 0 6px var(--amber); }
  #page { flex:1 1 auto; overflow-y:auto; padding:0 16px 24px; -webkit-overflow-scrolling:touch; }
  h1 { font:800 20px/1 var(--mono); letter-spacing:.2em; text-transform:uppercase; margin:6px 0 4px; }
  .sect { font:600 10px/1 var(--mono); letter-spacing:.15em; text-transform:uppercase; color:var(--muted); margin:18px 0 8px; display:flex; justify-content:space-between; gap:8px; }
  .muted { color:var(--muted); font-size:14px; }
  .note { font-size:13px; color:var(--muted); margin:8px 0 0; }
  .box { border:1px solid var(--hair); background:var(--surface); padding:12px 14px; color:var(--muted); font-size:13.5px; }
  .box b { display:block; color:var(--text); margin-bottom:2px; font-size:14px; }
  .warn { border:1px solid #6b4a14; background:#1d1608; color:#f0cf8f; padding:12px 14px; font-size:13.5px; margin:10px 0; }
  .warn b { color:#ffe2a8; }
  .err { color:#ff9f86; font-size:13.5px; margin-top:8px; }

  /* The readout: bezel, glass, phosphor. */
  .readout { border:1px solid var(--shadowline); border-radius:3px; background:linear-gradient(#17121d,#2a2233); padding:6px; }
  .glass { background:linear-gradient(135deg,rgba(255,255,255,.05),transparent 40%),#0a0810; border-radius:2px; padding:12px 14px; }
  .ph { color:var(--phosphor); text-shadow:0 0 1px var(--phosphor),0 0 10px rgba(169,111,232,.55); font:600 22px/1.1 var(--mono); overflow-wrap:anywhere; }
  .ph.off { color:var(--muted); text-shadow:none; }
  .ph-sub { color:var(--muted); font:600 10px/1.3 var(--mono); letter-spacing:.14em; text-transform:uppercase; margin-top:6px; }

  /* Keys: butted and square. */
  .bank { display:grid; border:1px solid var(--hair); }
  .key { min-height:48px; width:100%; background:linear-gradient(#2b2433,#221d2b); color:var(--text); border:0; border-top:1px solid var(--hair); font:600 14px/1.25 -apple-system,system-ui,sans-serif; text-align:left; padding:8px 14px; display:flex; align-items:center; justify-content:space-between; gap:8px; cursor:pointer; }
  .bank > .key:first-child { border-top:0; }
  .bank > .key + .key { border-top:1px solid var(--shadowline); box-shadow:0 -1px 0 var(--hair); }
  .key:disabled { color:var(--dim); cursor:not-allowed; }
  .key.on, .key[aria-pressed="true"] { background:var(--plum); color:#fff; box-shadow:inset 0 0 0 1px var(--plum-lit); }
  .key.armed { background:var(--plum); color:#fff; box-shadow:inset 0 0 0 1px var(--plum-lit); }
  .key small { display:block; font:600 9px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; margin-bottom:3px; color:var(--muted); }
  .key.on small, .key[aria-pressed="true"] small, .key.armed small { color:rgba(255,255,255,.8); }
  .key .words { font-weight:400; font-size:13.5px; display:block; }
  .chip { min-height:36px; width:auto; background:var(--surface); border:1px solid var(--hair); color:var(--muted); font:600 10px/1 var(--mono); letter-spacing:.15em; text-transform:uppercase; justify-content:center; padding:0 14px; }
  .gokey { min-height:36px; padding:0 14px; background:#2a1510; color:#ff8f70; border:1px solid #6b2a18; font:600 10px/1 var(--mono); letter-spacing:.15em; text-transform:uppercase; cursor:pointer; }
  .send { display:block; width:100%; min-height:56px; margin-top:12px; background:var(--plum); color:#fff; border:1px solid var(--plum-lit); font:700 16px/1 -apple-system,system-ui,sans-serif; cursor:pointer; }
  .send:disabled { opacity:.45; cursor:not-allowed; }
  .send.go { background:linear-gradient(#ff6a45,#e8401c); border-color:#ff8f70; }
  .send.quiet { background:var(--raised); border-color:var(--hair); color:var(--text); }
  .twin { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; } .twin .send { margin:0; min-height:52px; }
  .types { grid-template-columns:1fr 1fr; } .types .key { justify-content:center; text-align:center; border:1px solid var(--shadowline); }
  input.f, textarea.f { width:100%; display:block; background:var(--surface); color:var(--text); border:1px solid var(--hair); border-radius:0; padding:12px; font:16px/1.3 -apple-system,system-ui,sans-serif; }
  textarea.f { min-height:68px; resize:none; }
  .code-in { letter-spacing:.3em; font-size:24px !important; text-align:center; }
  .code-in::placeholder { letter-spacing:normal; font-size:16px; }
  .big-code { text-align:center; font:700 34px/1 var(--mono); letter-spacing:.3em; color:var(--phosphor); margin:8px 0 14px; text-shadow:0 0 10px rgba(169,111,232,.55); }
  .seg { display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--hair); } .seg button { min-height:44px; background:var(--surface); color:var(--muted); border:0; font:600 10px/1 var(--mono); letter-spacing:.15em; text-transform:uppercase; } .seg button[aria-selected="true"] { color:var(--phosphor); box-shadow:inset 0 -2px 0 var(--plum-lit); background:var(--raised); }
  .lockbar { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 12px; background:var(--surface); border:1px solid var(--hair); margin-top:10px; font:600 10px/1.3 var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .lockbar.open { border-color:#6b2a18; color:#ff8f70; }

  /* The Search ring, as the booth's (public/refrain.css .rf-sf): rest, focus, travelling. */
  .rf-sf { position:relative; isolation:isolate; border-radius:5px; padding:1.5px; background:var(--hair); margin-top:8px; }
  .rf-sf-ring, .rf-sf-glow { position:absolute; border-radius:inherit; overflow:hidden; opacity:0; transition:opacity 250ms ease-out; pointer-events:none; }
  .rf-sf-ring { inset:0; z-index:-1; } .rf-sf-glow { inset:-2px; z-index:-2; filter:blur(9px); }
  .rf-sf-ring i, .rf-sf-glow i { position:absolute; top:-100%; left:0; width:300%; height:300%; background:linear-gradient(60deg,#5B2FA0,#A96FE8,#E6D7FF,#7A44C4,#A96FE8,#5B2FA0); }
  .rf-sf:focus-within .rf-sf-ring { opacity:1; } .rf-sf:focus-within .rf-sf-glow { opacity:.25; }
  .rf-sf.typing .rf-sf-ring i, .rf-sf.typing .rf-sf-glow i { animation:rf-ring-slide 1.8s ease-in-out infinite alternate; will-change:transform; }
  .rf-sf.typing .rf-sf-ring { opacity:1; } .rf-sf.typing .rf-sf-glow { opacity:.65; }
  @keyframes rf-ring-slide { to { transform:translateX(-66.667%); } }
  .rf-sf input.f { border-color:transparent; border-radius:4px; outline:none; }
  @media (prefers-reduced-motion:reduce) { .rf-sf.typing .rf-sf-ring i, .rf-sf.typing .rf-sf-glow i { animation:none; } }

  /* Rows: results, flags, history. */
  .rows { border:1px solid var(--hair); }
  .row { display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding:11px 14px; background:var(--surface); border-top:1px solid var(--shadowline); box-shadow:0 -1px 0 #2a2233; }
  .row:first-child { border-top:0; box-shadow:none; }
  .row .t { font-weight:600; overflow-wrap:anywhere; } .row .s { color:var(--muted); font-size:13px; grid-column:1/-1; overflow-wrap:anywhere; } .row .a { font:600 10px/1.4 var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); text-align:right; }
  .row .acts { grid-column:1/-1; margin-top:6px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .tagc { display:inline-block; font:600 9px/1 var(--mono); letter-spacing:.15em; text-transform:uppercase; padding:4px 6px; border:1px solid var(--amber); color:var(--amber); margin-right:6px; }
  .tagc.note { border-color:var(--plum-lit); color:var(--phosphor); }
  .fcard { background:var(--surface); border:1px solid var(--hair); margin-bottom:10px; padding:10px; }
  .pic { aspect-ratio:16/9; background:#000 linear-gradient(135deg,#1b1524,#07050a); border:1px solid var(--hair); display:flex; align-items:center; justify-content:center; text-align:center; color:var(--muted); font:600 10px/1.4 var(--mono); letter-spacing:.1em; text-transform:uppercase; overflow:hidden; }
  .pic img { width:100%; height:100%; object-fit:contain; display:block; }
  /* History */
  .hx { padding:12px 14px; background:var(--surface); border-top:1px solid var(--shadowline); box-shadow:0 -1px 0 #2a2233; }
  .hx:first-child { border-top:0; box-shadow:none; }
  .hx .nm { font-weight:600; overflow-wrap:anywhere; } .hx .nm small { color:var(--muted); font-weight:400; font-size:12px; margin-left:6px; }
  .tm { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:6px; }
  .tm span { display:block; font:600 9px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin-bottom:3px; }
  .tm b { font:600 14px/1 var(--mono); color:var(--text); }
  .hx.cur { background:linear-gradient(#8f50d4,#7a3cbd); border:1px solid var(--plum-lit); color:#fff; }
  .hx.cur .tm span { color:rgba(255,255,255,.75); } .hx.cur .tm b { color:#fff; } .hx.cur .tm b.big { font-size:20px; }
  .bar { height:3px; margin-top:8px; background:linear-gradient(90deg,#fff var(--p),rgba(255,255,255,.25) var(--p)); }

  /* Bottom nav */
  nav { flex:none; display:grid; grid-template-columns:repeat(5,1fr); background:linear-gradient(#17121d,#0f0b14); border-top:1px solid var(--hair); padding-bottom:env(safe-area-inset-bottom); }
  nav button { background:none; border:0; color:var(--muted); min-height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font:600 9px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; cursor:pointer; position:relative; border-right:1px solid var(--shadowline); box-shadow:1px 0 0 #2a2233; }
  nav button:last-child { border-right:0; box-shadow:none; }
  nav svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  nav button[aria-current="page"] { color:var(--phosphor); }
  nav button[aria-current="page"]::after { content:""; position:absolute; top:0; left:18%; right:18%; height:2px; background:var(--plum-lit); box-shadow:0 0 10px var(--plum-lit); }
  nav .alertkey { color:#fff; }
  nav .cap { width:44px; height:44px; margin-top:-18px; border-radius:3px; background:var(--plum); border:1px solid var(--plum-lit); display:grid; place-items:center; box-shadow:0 0 0 3px var(--ground),0 0 18px rgba(132,70,201,.55); }

  /* Sheets and the bottom banner */
  .scrim { position:absolute; inset:0; background:rgba(0,0,0,.5); z-index:7; }
  .sheet { position:absolute; left:0; right:0; bottom:0; top:9%; background:var(--ground); border-top:1px solid var(--hair); border-radius:10px 10px 0 0; box-shadow:0 -8px 30px rgba(0,0,0,.7); z-index:8; display:flex; flex-direction:column; overscroll-behavior:contain; }
  .sheet-head { flex:none; display:flex; justify-content:space-between; align-items:center; gap:8px; padding:14px 16px 8px; }
  .sheet-body { flex:1 1 auto; overflow-y:auto; padding:0 16px calc(24px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling:touch; }
  /* Fixed, not in the flow: arming must not move the thing about to be tapped a second time. */
  .banner { position:absolute; left:12px; right:12px; bottom:calc(72px + env(safe-area-inset-bottom)); z-index:12; background:var(--plum); border:1px solid var(--plum-lit); color:#fff; padding:14px; font-weight:600; box-shadow:0 8px 30px rgba(0,0,0,.6); cursor:pointer; }
  .banner small { display:block; font:600 10px/1 var(--mono); letter-spacing:.15em; text-transform:uppercase; opacity:.85; margin-top:6px; }
  .banner.toast { background:var(--surface); border-color:var(--hair); cursor:default; }
  .banner.fault { background:#2a1510; border-color:#6b2a18; color:#ffb9a6; cursor:default; }

  /* The PIN lock fills the page until this phone has today's PIN. */
  #lock { padding:calc(24px + env(safe-area-inset-top)) 16px; overflow-y:auto; height:100%; }
  #lock label { display:block; font-size:13px; color:var(--muted); margin:14px 0 4px; }
  #lock .check { display:flex; align-items:center; gap:8px; color:var(--text); font-size:15px; margin-top:14px; } #lock .check input { width:auto; }
</style>
</head>
<body>
  <!-- Shown instead of everything else until this phone has today's PIN. -->
  <div id="lock" hidden>
    <div class="wordmark" style="margin-bottom:16px">Refrain</div>
    <div class="box">
      <label for="pin" style="margin-top:0" id="pin-label">Today's PIN</label>
      <input id="pin" class="f" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="8" />
      <label for="lock-name">Your name (the booth sees it)</label>
      <input id="lock-name" class="f" maxlength="40" autocomplete="name" />
      <div id="lock-hint" class="note"></div>
      <label class="check"><input id="trust" type="checkbox" /> Trust this phone for 30 days</label>
      <button id="unlock" class="send">Continue</button>
      <div id="lock-status" class="err" role="status" aria-live="polite"></div>
    </div>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <span class="wordmark">Refrain</span>
      <button id="link-lamp" class="lamp" aria-label="Link status">Link</button>
    </header>
    <main id="page"></main>
    <div id="banner" hidden></div>
    <nav id="nav" aria-label="Pages"></nav>
    <div id="sheet" hidden></div>
  </div>

  <script type="module" src="/remote.js"></script>
</body>
</html>
