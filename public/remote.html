<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- maximum-scale stops Safari's zoom-on-focus; pinch zoom still works
     (Safari has ignored user-scalable for pinch since iOS 10). -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Refrain · Phone</title>
<!-- Served by the separate phone listener (server/remote.js), which serves
     only this page and remote.js. Self-contained on purpose: no fonts, no
     Tailwind, nothing else from the app is reachable from here. -->
<style>
  /* A display rule below would otherwise beat the hidden attribute. */
  [hidden] { display:none !important; }
  :root { --ground:#0C0A11; --surface:#16121C; --raised:#221D2B; --hair:#3D3348; --text:#F4EFF3; --muted:#A295AC; --plum:#8446C9; --plum-lit:#A96FE8; --fault:#C9922E; }
  * { box-sizing: border-box; }
  /* A phone page that behaves like an app: no rubber-band bounce, no zoom on
     a quick double tap (which is exactly how a confirm is pressed), no text
     resizing on rotate. */
  html, body { overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  button, a, input, textarea, .slide, .pv { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  /* 16px or more, or Safari zooms in when a box gets the cursor. */
  input, textarea, select { font-size: 16px; }
  body { margin:0; background:var(--ground); color:var(--text); font:16px/1.4 -apple-system, system-ui, sans-serif; padding:16px; max-width:560px; margin-inline:auto; }
  h1 { font-size:18px; margin:0 0 4px; }
  h2 { font:600 11px/1 ui-monospace, Menlo, monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:20px 0 8px; }
  .muted { color:var(--muted); font-size:14px; }
  .card { background:var(--surface); border:1px solid var(--hair); border-radius:3px; padding:12px; }
  .progress { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:14px; }
  .progress b { font-weight:600; }
  .slides { display:flex; flex-direction:column; gap:8px; }
  .slide { text-align:left; width:100%; min-height:56px; padding:10px 12px; background:var(--raised); color:var(--text); border:1px solid var(--hair); border-radius:3px; font:inherit; }
  .slide small { display:block; color:var(--muted); font-size:12px; margin-bottom:2px; }
  .slide[aria-pressed="true"] { border-color:var(--plum-lit); box-shadow:inset 3px 0 0 var(--plum); }
  .types { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; }
  .type { min-height:48px; padding:8px; background:var(--raised); color:var(--text); border:1px solid var(--hair); border-radius:3px; font:inherit; font-size:14px; }
  .type[aria-pressed="true"] { border-color:var(--plum-lit); box-shadow:inset 0 0 0 1px var(--plum-lit); }
  textarea, input { width:100%; background:var(--surface); color:var(--text); border:1px solid var(--hair); border-radius:3px; padding:10px; font:inherit; }
  textarea { min-height:80px; }
  .send { width:100%; min-height:56px; margin-top:12px; background:var(--plum); color:#fff; border:0; border-radius:3px; font-weight:600; font-size:17px; }
  .send:disabled { opacity:.5; }
  .status { margin-top:10px; font-size:14px; min-height:20px; }
  .status.fault { color:var(--fault); }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  .pv { aspect-ratio:16/9; background:#000; border:1px solid var(--hair); border-radius:3px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; text-align:center; overflow:hidden; }
  .pv img { width:100%; height:100%; object-fit:contain; display:block; }
  .tabs { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; margin:14px 0 4px; }
  .tab { min-height:44px; background:var(--surface); color:var(--muted); border:1px solid var(--hair); border-radius:3px; font:inherit; font-size:15px; }
  .tab[aria-selected="true"] { color:var(--text); border-color:var(--plum-lit); box-shadow:inset 0 -2px 0 var(--plum); }
  .ctl { min-height:72px; background:var(--raised); color:var(--text); border:1px solid var(--hair); border-radius:3px; font:inherit; font-size:17px; font-weight:600; }
  .ctl.armed, .slide.armed { background:var(--plum); border-color:var(--plum-lit); color:#fff; }
  input[type="search"] { font-size:17px; }
  .slide .thumb { display:grid; grid-template-columns:96px 1fr; gap:10px; align-items:center; }
  .slide .thumb .pv { width:96px; }
  .slide .thumb.nopic { display:block; }
  .tray { position:fixed; inset:12% 0 0 0; background:var(--ground); border-top:1px solid var(--hair); border-radius:10px 10px 0 0; box-shadow:0 -8px 30px rgba(0,0,0,.6); display:flex; flex-direction:column; z-index:10; overscroll-behavior:contain; }
  .tray-head { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:12px 16px; font-weight:600; }
  .tray-grid { flex:1 1 auto; min-height:0; align-content:start; grid-auto-rows:max-content; overflow-y:auto; padding:0 16px 24px; display:grid; grid-template-columns:1fr 1fr; gap:10px; -webkit-overflow-scrolling:touch; }
  .tray-grid .slide { min-height:0; padding:6px; display:block; }
  .tray-grid .slide .pv { width:100%; margin-bottom:4px; }
  /* Fixed, not in the flow: arming must not move the thing about to be
     tapped a second time. */
  .confirm { position:fixed; left:16px; right:16px; bottom:calc(12px + env(safe-area-inset-bottom)); max-width:528px; margin-inline:auto; z-index:5; box-shadow:0 8px 30px rgba(0,0,0,.6); display:grid; grid-template-columns:1fr; gap:12px; align-items:center; padding:14px; background:var(--plum); color:#fff; border-radius:3px; font-weight:600; }
  .sent { display:grid; grid-template-columns:96px 1fr; gap:10px; align-items:center; }
  .sent .pv { width:96px; }
  .pv.armed { outline:2px solid var(--plum-lit); }
  .sect { font:600 11px/1 ui-monospace, Menlo, monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  summary.sect { min-height:44px; display:flex; align-items:center; cursor:pointer; }
  .stage-keys { display:grid; gap:8px; }
  .stage-keys .ctl { min-height:56px; text-align:left; padding:0 14px; }
  .ctl.on { border-color:var(--plum-lit); box-shadow:inset 3px 0 0 var(--plum); }
  .stage-clear { width:100%; min-height:56px; margin-top:8px; }
  .msg { border-top:1px solid var(--hair); padding:10px 0; }
  .msg:first-child { border-top:0; }
  .msg-name { font-weight:600; }
  .msg input { text-transform:uppercase; }
  .msg-keys { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .msg-keys .ctl { min-height:56px; }
</style>
</head>
<body>
  <h1>Refrain</h1>

  <!-- Shown instead of everything below until this phone has today's PIN. -->
  <div id="lock" class="card" hidden>
    <label for="pin" style="margin-top:0">Today's PIN</label>
    <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="8" />
    <label for="lock-name">Your name (the booth sees it)</label>
    <input id="lock-name" maxlength="40" autocomplete="name" />
    <div id="lock-hint" class="muted" style="margin-top:8px"></div>
    <label style="display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--text);font-size:15px">
      <input id="trust" type="checkbox" style="width:auto" /> Trust this phone for 30 days
    </label>
    <button id="unlock" class="send">Continue</button>
    <div id="lock-status" class="status" role="status" aria-live="polite"></div>
  </div>

  <div id="main">
  <div id="progress" class="card progress" style="margin-top:12px">Loading...</div>


  <!-- Shown only when the booth has switched off both Flags and Messages. -->
  <div id="nothing-here" class="card muted" style="margin-top:12px" hidden>Flagging and alerts are both switched off at the booth.</div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="flag" aria-selected="true">Flag</button>
    <button class="tab" role="tab" data-tab="alert" aria-selected="false">Alert</button>
  </div>

  <!-- Shown while an alert press is armed: what the second tap will do. -->
  <div id="confirm" class="confirm" role="button" tabindex="0" hidden>
    <div class="pv" hidden><img id="confirm-img" alt="" /></div>
    <div id="confirm-text"></div>
  </div>

  <!-- The phone is for alerts and flags (owner, 2026-10-04): a note to the
       stage, a pager code, and flagging a slide. Nothing here moves slides. -->
  <section id="tab-alert" hidden>
    <div id="control-locked" class="muted"></div>
    <div id="control" hidden>
      <!-- Stage message (handoff section 44): a note only the stage sees.
           Presets only from a phone; it stays up until it's taken down. -->
      <div id="stage" class="card">
        <div class="sect">Stage message</div>
        <div id="stage-now" class="muted" style="margin:6px 0 10px"></div>
        <div id="stage-keys" class="stage-keys"></div>
        <button id="stage-clear" class="ctl stage-clear">Take down</button>
      </div>

      <!-- Messages with a field to fill, like a pager code. -->
      <details id="msgs" class="card" style="margin-top:14px">
        <summary class="sect">Messages</summary>
        <div id="msg-list"></div>
      </details>
      <div class="muted" style="margin-top:8px">Every press needs a second tap.</div>
      <div id="control-status" class="status" role="status" aria-live="polite"></div>
    </div>
  </section>

  <section id="tab-flag">

  <h2>Which slide</h2>
  <div id="slides" class="slides"></div>
  <button id="open-tray" class="type" style="width:100%;margin-top:8px" hidden>Show all previews</button>

  <h2>What's wrong</h2>
  <div id="types" class="types"></div>
  <label for="note">Note (optional)</label>
  <textarea id="note" maxlength="500" placeholder="e.g. second line should say &quot;grace&quot;"></textarea>
  <label for="name">Your name</label>
  <input id="name" maxlength="40" autocomplete="name" />

  <button id="send" class="send" disabled>Send flag</button>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  </section>
  </div>

  <!-- Every slide of the presentation on screen, to pick the one to flag. -->
  <div id="tray" class="tray" hidden>
    <div class="tray-head"><span id="tray-title">All slides</span><button id="close-tray" class="type" style="min-height:40px">Close</button></div>
    <div id="tray-grid" class="tray-grid"></div>
  </div>

  <script type="module" src="/remote.js"></script>
</body>
</html>
