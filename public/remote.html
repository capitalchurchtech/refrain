<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Refrain · Phone</title>
<!-- Served by the separate phone listener (server/remote.js), which serves
     only this page and remote.js. Self-contained on purpose: no fonts, no
     Tailwind, nothing else from the app is reachable from here. -->
<style>
  :root { --ground:#0C0A11; --surface:#16121C; --raised:#221D2B; --hair:#3D3348; --text:#F4EFF3; --muted:#A295AC; --plum:#8446C9; --plum-lit:#A96FE8; --fault:#C9922E; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--ground); color:var(--text); font:16px/1.4 -apple-system, system-ui, sans-serif; padding:16px; max-width:560px; margin-inline:auto; }
  h1 { font-size:18px; margin:0 0 4px; }
  h2 { font:600 11px/1 ui-monospace, Menlo, monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:20px 0 8px; }
  .muted { color:var(--muted); font-size:14px; }
  .card { background:var(--surface); border:1px solid var(--hair); border-radius:3px; padding:12px; }
  .progress { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:14px; }
  .progress b { font-weight:600; }
  .slides { display:flex; flex-direction:column; gap:8px; }
  .slide { text-align:left; width:100%; min-height:56px; padding:10px 12px; background:var(--raised); color:var(--text); border:1px solid var(--hair); border-radius:3px; font:inherit; }
  .slide small { display:block; color:var(--muted); font-size:12px; margin-bottom:2px; }
  .slide[aria-pressed="true"] { border-color:var(--plum-lit); box-shadow:inset 3px 0 0 var(--plum); }
  .types { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; }
  .type { min-height:48px; padding:8px; background:var(--raised); color:var(--text); border:1px solid var(--hair); border-radius:3px; font:inherit; font-size:14px; }
  .type[aria-pressed="true"] { border-color:var(--plum-lit); box-shadow:inset 0 0 0 1px var(--plum-lit); }
  textarea, input { width:100%; background:var(--surface); color:var(--text); border:1px solid var(--hair); border-radius:3px; padding:10px; font:inherit; }
  textarea { min-height:80px; }
  .send { width:100%; min-height:56px; margin-top:12px; background:var(--plum); color:#fff; border:0; border-radius:3px; font-weight:600; font-size:17px; }
  .send:disabled { opacity:.5; }
  .status { margin-top:10px; font-size:14px; min-height:20px; }
  .status.fault { color:var(--fault); }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  .preview { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .preview figure { margin:0; }
  .preview figcaption { font:600 10px/1 ui-monospace, Menlo, monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
  .pv { aspect-ratio:16/9; background:#000; border:1px solid var(--hair); border-radius:3px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; text-align:center; overflow:hidden; }
  .pv img { width:100%; height:100%; object-fit:contain; display:block; }
  .tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:14px 0 4px; }
  .tab { min-height:44px; background:var(--surface); color:var(--muted); border:1px solid var(--hair); border-radius:3px; font:inherit; font-size:15px; }
  .tab[aria-selected="true"] { color:var(--text); border-color:var(--plum-lit); box-shadow:inset 0 -2px 0 var(--plum); }
  .ctl { min-height:72px; background:var(--raised); color:var(--text); border:1px solid var(--hair); border-radius:3px; font:inherit; font-size:17px; font-weight:600; }
  .ctl.armed, .slide.armed { background:var(--plum); border-color:var(--plum-lit); color:#fff; }
  input[type="search"] { font-size:17px; }
</style>
</head>
<body>
  <h1>Refrain</h1>

  <!-- Shown instead of everything below until this phone has today's PIN. -->
  <div id="lock" class="card" hidden>
    <label for="pin" style="margin-top:0">Today's PIN</label>
    <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="8" />
    <label for="lock-name">Your name (the booth sees it)</label>
    <input id="lock-name" maxlength="40" autocomplete="name" />
    <div id="lock-hint" class="muted" style="margin-top:8px"></div>
    <label style="display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--text);font-size:15px">
      <input id="trust" type="checkbox" style="width:auto" /> Trust this phone for 30 days
    </label>
    <button id="unlock" class="send">Continue</button>
    <div id="lock-status" class="status" role="status" aria-live="polite"></div>
  </div>

  <div id="main">
  <div id="progress" class="card progress" style="margin-top:12px">Loading...</div>

  <div class="preview">
    <figure><figcaption>Now</figcaption><div id="pv-now" class="pv"></div></figure>
    <figure><figcaption>Next</figcaption><div id="pv-next" class="pv"></div></figure>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="flag" aria-selected="true">Flag</button>
    <button class="tab" role="tab" data-tab="search" aria-selected="false">Search</button>
    <button class="tab" role="tab" data-tab="control" aria-selected="false">Control</button>
  </div>

  <section id="tab-search" hidden>
    <input id="q" type="search" placeholder="Search any lyric..." autocomplete="off" />
    <div id="search-results" class="slides" style="margin-top:10px"></div>
  </section>

  <section id="tab-control" hidden>
    <div id="control-locked" class="muted"></div>
    <div id="control" hidden>
      <div class="muted" style="margin-bottom:10px">Each press asks you to tap again to confirm.</div>
      <div class="types">
        <button class="ctl" data-kind="previous">Previous slide</button>
        <button class="ctl" data-kind="next">Next slide</button>
      </div>
      <h2>Safe slides</h2>
      <div id="safe" class="slides"></div>
      <div id="control-status" class="status" role="status" aria-live="polite"></div>
    </div>
  </section>

  <section id="tab-flag">

  <h2>Which slide</h2>
  <div id="slides" class="slides"></div>

  <h2>What's wrong</h2>
  <div id="types" class="types"></div>
  <label for="note">Note (optional)</label>
  <textarea id="note" maxlength="500" placeholder="e.g. second line should say &quot;grace&quot;"></textarea>
  <label for="name">Your name</label>
  <input id="name" maxlength="40" autocomplete="name" />

  <button id="send" class="send" disabled>Send flag</button>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  </section>
  </div>

  <script type="module" src="/remote.js"></script>
</body>
</html>
